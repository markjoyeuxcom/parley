[package]
name = "parley"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
# The whole migration hinges on this crate: it is node-pty's replacement, and
# the PTY layer is the part of this app that has cost the most to get right.
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
