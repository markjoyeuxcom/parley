# Parley continuous integration on GitLab.
#
# Every check needs macOS: the native app is Swift with an embedded Ghostty,
# and the deterministic suite runs the AppKit/SwiftUI checks in process.
# GitLab.com's shared macOS runners are available only on paid tiers, so every
# job targets the self-hosted group runner tagged `macos`: an Apple Silicon Mac
# running gitlab-runner with the Tart custom executor (gitlab-tart-executor).
# Each job gets a throwaway macOS VM cloned from its `image:` and destroyed
# afterwards, so nothing survives between jobs and every job installs what it
# needs itself. Three facts of that runner shape this file:
#
# - A job must name an `image:`. Without one the executor's prepare stage
#   fails with "CUSTOM_ENV_CI_JOB_ID is missing and no --default-image was
#   set", which is its wording for a missing job image. The image is pinned
#   by digest so a build is never made on an image that moved under it;
#   bump with `tart pull ghcr.io/cirruslabs/macos-tahoe-base:latest && tart list`.
# - The job's shell is neither a login nor an interactive shell, so PATH holds
#   only the system directories: Homebrew and its Node are not on it. Every
#   toolchain path below is named explicitly.
# - The VM has the Xcode command line tools, Homebrew, git and curl, and no
#   Docker runtime. The two checks that need a local Docker daemon are left
#   out with an explicit `--skip`, which prints one SKIP line per check and
#   counts them in the summary; they are not passed, and they still run on a
#   Mac with Docker (`npm test` skips nothing).

stages:
  - verify
  - release

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  # The public repository scan walks the complete reachable history.
  GIT_DEPTH: 0
  GIT_STRATEGY: fetch
  # What ghcr.io/cirruslabs/macos-tahoe-base:latest resolved to on
  # 19 September 2026; the runner allows ghcr.io/cirruslabs/macos-* only.
  MACOS_IMAGE: ghcr.io/cirruslabs/macos-tahoe-base@sha256:1b093499716409d29e8b5336844528e1cae375db97d2ad8e5aeff78cf0da201e
  # Node is build tooling here, never shipped, but the image's Homebrew Node
  # is off PATH and unpinned, so the official nodejs.org build is fetched and
  # checked instead. Bump both together (SHASUMS256.txt for the version).
  NODE_VERSION: "24.21.0"
  NODE_SHA256: "6239d4cf92d864487ec8cd3615038f7b67e7f58b77b21cd2f09ea9fbd68065fe"
  # The two deterministic checks that need a Docker daemon the VM cannot run.
  DOCKER_ONLY_CHECKS: "container bypass preflight,container follow-up image probe"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

default:
  image: $MACOS_IMAGE
  tags:
    - macos

.macos-toolchain:
  before_script:
    - |
      node_dir="node-v$NODE_VERSION-darwin-arm64"
      curl --fail --location --silent --show-error --output "$HOME/$node_dir.tar.xz" "https://nodejs.org/dist/v$NODE_VERSION/$node_dir.tar.xz"
      echo "$NODE_SHA256  $HOME/$node_dir.tar.xz" | shasum -a 256 -c -
      tar -xJf "$HOME/$node_dir.tar.xz" -C "$HOME"
    - export PATH="$HOME/node-v$NODE_VERSION-darwin-arm64/bin:/opt/homebrew/bin:$PATH"
    - node --version
    - swift --version | head -1
    - xcode-select -p

test-and-build:
  stage: verify
  extends: .macos-toolchain
  interruptible: true
  script:
    - npm run test:checks -- --skip "$DOCKER_ONLY_CHECKS"
    - npm run test:scripts
    - npm run scan:public
    - npm run scan:platform
    - npm run build

# Prepares production assets for review; this job never publishes a release
# or changes the stable update feed. Signing variables must be masked and
# protected in GitLab, and the version tag must itself be protected.
prepare-production-release:
  stage: release
  extends: .macos-toolchain
  when: manual
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"
  script:
    - npm run test:checks -- --skip "$DOCKER_ONLY_CHECKS"
    - npm run test:scripts
    - npm run scan:public
    - npm run scan:platform
    - mkdir -p dist
    - npm run test:soak -- --rounds 25 --output dist/Parley-Ghostty-soak.json
    - |
      set -eu
      test "$CI_COMMIT_REF_PROTECTED" = "true"
      : "${MACOS_DEVELOPER_ID_APPLICATION:?Configure the protected Developer ID identity}"
      : "${MACOS_DEVELOPER_ID_P12_BASE64:?Configure the protected PKCS12 certificate}"
      : "${MACOS_DEVELOPER_ID_P12_PASSWORD:?Configure the protected PKCS12 password}"
      : "${APPLE_NOTARY_KEY_P8_BASE64:?Configure the protected notary key}"
      : "${APPLE_NOTARY_KEY_ID:?Configure the protected notary key ID}"
      : "${APPLE_NOTARY_ISSUER_ID:?Configure the protected notary issuer}"
      : "${SPARKLE_PUBLIC_ED_KEY:?Configure the Sparkle public key}"
      : "${SPARKLE_PRIVATE_ED_KEY:?Configure the protected Sparkle private key}"
      notes=".github/release-notes/${CI_COMMIT_TAG}.md"
      test -f "$notes"
      signing_dir="$(mktemp -d "${TMPDIR:-/private/tmp}/parley-signing.XXXXXX")"
      keychain="$signing_dir/signing.keychain-db"
      cleanup_signing() {
        if test -f "$signing_dir/keychains.json"; then
          /usr/bin/python3 -c 'import json,subprocess,sys; subprocess.run(["/usr/bin/security", "list-keychains", "-d", "user", "-s"] + json.load(open(sys.argv[1])), check=True)' "$signing_dir/keychains.json" || true
        fi
        security delete-keychain "$keychain" >/dev/null 2>&1 || true
        rm -rf "$signing_dir"
      }
      trap cleanup_signing EXIT
      trap 'exit 130' INT
      trap 'exit 143' TERM
      umask 077
      /usr/bin/python3 -c 'import json,shlex,subprocess,sys; json.dump(shlex.split(subprocess.check_output(["/usr/bin/security", "list-keychains", "-d", "user"], text=True)), open(sys.argv[1], "w"))' "$signing_dir/keychains.json"
      printf '%s' "$MACOS_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$signing_dir/certificate.p12"
      printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$signing_dir/notary.p8"
      keychain_password="$(openssl rand -hex 24)"
      security create-keychain -p "$keychain_password" "$keychain"
      security set-keychain-settings -lut 21600 "$keychain"
      security unlock-keychain -p "$keychain_password" "$keychain"
      security import "$signing_dir/certificate.p12" -k "$keychain" -P "$MACOS_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
      security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
      security list-keychains -d user -s "$keychain"
      export PARLEY_RELEASE_TAG="$CI_COMMIT_TAG"
      export PARLEY_CODESIGN_IDENTITY="$MACOS_DEVELOPER_ID_APPLICATION"
      export PARLEY_SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY"
      export PARLEY_SPARKLE_PRIVATE_ED_KEY="$SPARKLE_PRIVATE_ED_KEY"
      export PARLEY_NOTARY_KEY_ID="$APPLE_NOTARY_KEY_ID"
      export PARLEY_NOTARY_ISSUER_ID="$APPLE_NOTARY_ISSUER_ID"
      export PARLEY_NOTARY_KEY="$signing_dir/notary.p8"
      npm run release:mac
      npm run verify:launch:mac
      version="$(node -p "require('./package.json').version")"
      checksums="dist/Parley-${version}-mac-arm64.SHA256SUMS"
      (cd dist && shasum -a 256 "Parley-Ghostty-soak.json" >> "$(basename "$checksums")")
      LC_ALL=C sort -o "$checksums" "$checksums"
      (cd dist && shasum -a 256 -c "$(basename "$checksums")")
      cp "$notes" dist/production-release-notes.md
  artifacts:
    when: on_success
    expire_in: 2 weeks
    paths:
      - dist/Parley-*-mac-arm64.*
      - dist/Parley-*-mac-arm64-INSTALL.txt
      - dist/Parley-Ghostty-soak.json
      - dist/appcast.xml
      - dist/parley.rb
      - dist/production-release-notes.md

# Cuts an unnotarized test beta from an existing version tag and publishes it
# as a release of this GitLab project, with every file stored in the project's
# generic package registry as package `parley`, version `<tag>`. It does what
# the retired GitHub Actions workflow did, in the macOS VM. The job signs in
# with its own CI job token through glab's CI auto-login, so no GitLab login
# or personal token exists anywhere on the runner; `glab` is installed into
# the throwaway VM by the job. A release that already exists for the tag
# fails the job instead of being overwritten.
release-beta:
  stage: release
  extends: .macos-toolchain
  when: manual
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    - brew install glab
    - glab --version
    - npm run test:checks -- --skip "$DOCKER_ONLY_CHECKS"
    - npm run test:scripts
    - npm run scan:public
    - npm run scan:platform
    - mkdir -p dist
    - npm run test:soak -- --rounds 25 --output dist/Parley-Ghostty-soak.json
    # PARLEY_RELEASE_TAG is deliberately not a job variable: the release CLI
    # reads it from the environment, and the script tests assert the CLI has
    # no preset tag. It is passed to the release step only.
    - PARLEY_RELEASE_TAG="$CI_COMMIT_TAG" npm run release:mac:beta
    - npm run verify:launch:mac
    - |
      version="$(node -p "require('./package.json').version")"
      checksums="dist/Parley-${version}-mac-arm64.SHA256SUMS"
      (cd dist && shasum -a 256 "Parley-Ghostty-soak.json" >> "$(basename "$checksums")")
      LC_ALL=C sort -o "$checksums" "$checksums"
      (cd dist && shasum -a 256 -c "$(basename "$checksums")")
    - |
      version="$(node -p "require('./package.json').version")"
      base="dist/Parley-${version}-mac-arm64"
      notes=".github/release-notes/${CI_COMMIT_TAG}.md"
      test -f "$notes"
      GLAB_ENABLE_CI_AUTOLOGIN=true glab release create "$CI_COMMIT_TAG" \
        "$base.dmg" \
        "$base.zip" \
        "$base.release.json" \
        "$base.SHA256SUMS" \
        "${base}-INSTALL.txt" \
        "dist/Parley-Ghostty-soak.json" \
        --repo "$CI_PROJECT_PATH" \
        --use-package-registry \
        --package-name parley \
        --no-update \
        --name "Parley v${version} — unnotarized test beta" \
        --notes-file "$notes"
  artifacts:
    expire_in: 2 weeks
    paths:
      - dist/Parley-*-mac-arm64.*
      - dist/Parley-Ghostty-soak.json
