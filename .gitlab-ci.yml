# The application imports SwiftUI and AppKit, so its build and deterministic
# checks require a macOS runner. Until one is configured, CI performs repository
# security scanning and the native build gates remain mandatory locally.

stages:
  - test
  - secret-detection

sast:
  stage: test

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: "true"

secret_detection:
  stage: secret-detection
