name: Prepare macOS draft release

# Signs, notarizes and verifies one version tag and retains the result as an
# unpublished draft. It runs in the `release-signing` environment, which holds
# the signing secrets, admits only `v*` tags and requires a reviewer, so a
# dispatch from any other ref, or by anyone the environment does not admit,
# never reaches the secrets. The tag named in the input must be the ref the
# workflow was dispatched from, and the tag, its release notes and the
# toolchain are checked before any signing material is decoded.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.0; dispatch from that tag
        required: true
        type: string

permissions:
  contents: write

env:
  # Keep equal to .github/workflows/ci.yml; a script test checks they match.
  NODE_VERSION: "24.21.0"
  NODE_SHA256: "6239d4cf92d864487ec8cd3615038f7b67e7f58b77b21cd2f09ea9fbd68065fe"
  DOCKER_ONLY_CHECKS: "container bypass preflight,container follow-up image probe"

jobs:
  draft:
    name: Verify, notarize and create draft
    runs-on: macos-latest
    environment: release-signing
    timeout-minutes: 180
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Preflight the tag, its notes and the checkout
        env:
          PARLEY_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          case "$PARLEY_RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag is not a Parley semantic version: $PARLEY_RELEASE_TAG" >&2; exit 1 ;;
          esac
          test "$GITHUB_REF" = "refs/tags/$PARLEY_RELEASE_TAG" || {
            echo "Dispatch this workflow from the tag itself: ref is $GITHUB_REF, tag is $PARLEY_RELEASE_TAG" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$PARLEY_RELEASE_TAG^{commit}")"
          notes=".github/release-notes/${PARLEY_RELEASE_TAG}.md"
          test -f "$notes"
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$PARLEY_RELEASE_TAG" || { echo "package.json is $version, tag is $PARLEY_RELEASE_TAG" >&2; exit 1; }

      - name: Report the toolchain
        run: |
          xcode-select -p
          git --version
          swift --version | head -1

      - name: Install the pinned Node build
        run: |
          set -eu
          node_dir="node-v$NODE_VERSION-darwin-arm64"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$node_dir.tar.xz" "https://nodejs.org/dist/v$NODE_VERSION/$node_dir.tar.xz"
          echo "$NODE_SHA256  $RUNNER_TEMP/$node_dir.tar.xz" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/$node_dir.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$node_dir/bin" >> "$GITHUB_PATH"

      - name: Run the native checks
        run: npm run test:checks -- --skip "$DOCKER_ONLY_CHECKS"

      - name: Run the script tests
        run: npm run test:scripts

      - name: Scan the public repository
        run: npm run scan:public

      - name: Scan platform dependencies
        run: npm run scan:platform

      - name: Run Ghostty runtime release gate
        run: |
          mkdir -p dist
          npm run test:soak -- --rounds 25 --output dist/Parley-Ghostty-soak.json

      # The signing material lives at fixed paths, declared on each step that
      # touches them (the runner context is not available to workflow-level
      # env), so cleanup needs no record of what import created.
      - name: Import Developer ID identity and notary credentials
        env:
          PARLEY_TEMP_KEYCHAIN: ${{ runner.temp }}/parley-signing.keychain-db
          PARLEY_SIGNING_P12: ${{ runner.temp }}/parley-developer-id.p12
          PARLEY_NOTARY_KEY: ${{ runner.temp }}/parley-notary-key.p8
          PARLEY_SIGNING_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          PARLEY_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          PARLEY_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -eu
          umask 077
          test -n "$PARLEY_SIGNING_P12_BASE64"
          test -n "$PARLEY_SIGNING_P12_PASSWORD"
          test -n "$PARLEY_NOTARY_KEY_BASE64"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$PARLEY_SIGNING_P12_BASE64" | base64 --decode > "$PARLEY_SIGNING_P12"
          printf '%s' "$PARLEY_NOTARY_KEY_BASE64" | base64 --decode > "$PARLEY_NOTARY_KEY"
          security create-keychain -p "$keychain_password" "$PARLEY_TEMP_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$PARLEY_TEMP_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$PARLEY_TEMP_KEYCHAIN"
          security import "$PARLEY_SIGNING_P12" -k "$PARLEY_TEMP_KEYCHAIN" -P "$PARLEY_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$PARLEY_TEMP_KEYCHAIN"
          security list-keychains -d user -s "$PARLEY_TEMP_KEYCHAIN"

      - name: Prepare, notarize and verify release assets
        env:
          PARLEY_NOTARY_KEY: ${{ runner.temp }}/parley-notary-key.p8
          PARLEY_RELEASE_TAG: ${{ inputs.tag }}
          PARLEY_CODESIGN_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          PARLEY_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          PARLEY_SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          PARLEY_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          PARLEY_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: npm run release:mac

      - name: Prove the packaged application reaches its event loop
        run: npm run verify:launch:mac

      - name: Add the soak report to the verified checksum set
        run: |
          version="$(node -p "require('./package.json').version")"
          checksums="dist/Parley-${version}-mac-arm64.SHA256SUMS"
          (cd dist && shasum -a 256 "Parley-Ghostty-soak.json" >> "$(basename "$checksums")")
          LC_ALL=C sort -o "$checksums" "$checksums"
          (cd dist && shasum -a 256 -c "$(basename "$checksums")")

      # gh creates the draft before uploading, so a failed upload can leave an
      # incomplete draft behind; publishing is a separate, reviewed action.
      - name: Create an unpublished GitHub draft
        env:
          GH_TOKEN: ${{ github.token }}
          PARLEY_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          base="dist/Parley-${version}-mac-arm64"
          notes=".github/release-notes/${PARLEY_RELEASE_TAG}.md"
          test -f "$notes"
          gh release create "$PARLEY_RELEASE_TAG" \
            "$base.dmg" \
            "$base.zip" \
            "$base.release.json" \
            "$base.SHA256SUMS" \
            "${base}-INSTALL.txt" \
            "dist/appcast.xml" \
            "dist/parley.rb" \
            "dist/Parley-Ghostty-soak.json" \
            --verify-tag \
            --draft \
            --title "Parley v${version}" \
            --notes-file "$notes"

      # The same fixed paths, removed whether or not the import step ran.
      - name: Remove temporary signing material
        if: always()
        env:
          PARLEY_TEMP_KEYCHAIN: ${{ runner.temp }}/parley-signing.keychain-db
          PARLEY_SIGNING_P12: ${{ runner.temp }}/parley-developer-id.p12
          PARLEY_NOTARY_KEY: ${{ runner.temp }}/parley-notary-key.p8
        run: |
          security delete-keychain "$PARLEY_TEMP_KEYCHAIN" || true
          rm -f "$PARLEY_SIGNING_P12" "$PARLEY_NOTARY_KEY"
